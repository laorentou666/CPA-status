services:
  cpa-status:
    build: .
    restart: unless-stopped
#    ports:
#      - "8080:8080"
    environment:
      CONFIG_FILE: /app/.env
      TZ: Asia/Shanghai
    volumes:
      - cpa-status-data:/data
      - ./.env:/app/.env:ro
    networks:
      - 1panel-network

volumes:
  cpa-status-data:

networks:
  1panel-network:
    external: true