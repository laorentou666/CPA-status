services:
  cpa-status:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CPA_MANAGEMENT_URL: ${CPA_MANAGEMENT_URL}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      ACCOUNT_SYNC_INTERVAL_SECONDS: ${ACCOUNT_SYNC_INTERVAL_SECONDS:-30}
      QUOTA_SYNC_INTERVAL_SECONDS: ${QUOTA_SYNC_INTERVAL_SECONDS:-600}
      QUOTA_CONCURRENCY: ${QUOTA_CONCURRENCY:-3}
      QUOTA_WARNING_PERCENT: ${QUOTA_WARNING_PERCENT:-80}
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-}
      NOTIFY_MIN_SEVERITY: ${NOTIFY_MIN_SEVERITY:-warning}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      PUSHPLUS_TOPIC: ${PUSHPLUS_TOPIC:-}
      PUSHPLUS_CHANNEL: ${PUSHPLUS_CHANNEL:-wechat}
    volumes:
      - cpa-status-data:/data

volumes:
  cpa-status-data:
