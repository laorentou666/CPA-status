<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>CPA Status</title>
    <link rel="stylesheet" href="/styles.css?v=0.5.0">
  </head>
  <body>
    <div id="loginView" class="login-shell" hidden>
      <form id="loginForm" class="login-card">
        <div class="brand-mark">CS</div>
        <h1>管理员登录</h1>
        <p class="login-sub">请输入管理密码以进入管理面板</p>
        <div class="field">
          <label for="password">管理密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
        <a class="login-back" href="/">返回游客页</a>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">CS</div>
          <div class="brand-text">
            <strong>CPA Status</strong>
            <span id="pageMode">账号监测</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="connectionBadge" class="pill pill-muted">等待同步</span>
          <span id="lastSync" class="last-sync">尚未同步</span>
          <button id="refreshButton" class="btn btn-primary" type="button" hidden>立即同步</button>
          <a id="adminLink" class="btn btn-ghost" href="/admin">管理员入口</a>
          <button id="logoutButton" class="btn btn-ghost" type="button" title="退出登录" hidden>退出</button>
        </div>
      </header>

      <main class="main">
        <section class="metrics-bar" aria-label="账号摘要">
          <article class="metric-cell"><span class="metric-label">账号总数</span><strong id="totalCount" class="metric-value">0</strong></article>
          <article class="metric-cell metric-good"><span class="metric-label">正常</span><strong id="healthyCount" class="metric-value">0</strong></article>
          <article class="metric-cell metric-warn"><span class="metric-label">警告</span><strong id="warningCount" class="metric-value">0</strong></article>
          <article class="metric-cell metric-danger"><span class="metric-label">额度耗尽</span><strong id="exhaustedCount" class="metric-value">0</strong></article>
          <article class="metric-cell metric-muted"><span class="metric-label">不可用</span><strong id="unavailableCount" class="metric-value">0</strong></article>
        </section>

        <section class="card section-body">
          <div class="section-head">
            <div>
              <h2>账号状态</h2>
              <p id="scheduleText" class="section-sub"></p>
              <p id="selectionText" class="section-sub" hidden></p>
            </div>
            <div class="section-actions">
              <button id="addAccountButton" class="btn btn-primary" type="button">添加账号</button>
              <div id="managementActions" class="mgmt-actions" hidden>
                <button id="deleteSelectedButton" class="btn btn-danger" type="button" disabled>删除所选</button>
                <button id="deleteAbnormalButton" class="btn btn-danger-outline" type="button">删除异常账号</button>
              </div>
            </div>
          </div>

          <div class="filters">
            <input id="searchInput" type="search" placeholder="搜索账号、备注或索引" aria-label="搜索账号" class="input">
            <select id="providerFilter" aria-label="Provider 筛选" class="input"><option value="">全部 Provider</option></select>
            <select id="stateFilter" aria-label="状态筛选" class="input">
              <option value="">全部状态</option>
              <option value="healthy">正常</option>
              <option value="warning">警告</option>
              <option value="quota_exhausted">额度耗尽</option>
              <option value="auth_invalid">认证失效</option>
              <option value="disabled">已禁用</option>
              <option value="unavailable">不可用</option>
              <option value="unknown">未知</option>
            </select>
          </div>

          <div class="table-wrap">
            <table id="accountsTable" class="data-table">
              <thead>
                <tr>
                  <th id="selectColumnHeader" class="col-check" hidden><input id="selectAllAccounts" type="checkbox" aria-label="选择全部可删除账号"></th>
                  <th class="col-account">账号</th>
                  <th class="col-provider">Provider</th>
                  <th class="col-state">状态</th>
                  <th class="col-plan">计划</th>
                  <th class="col-quota">额度</th>
                  <th class="col-req">请求</th>
                  <th class="col-time">最后检查</th>
                  <th id="operationHeader" class="col-action" hidden>操作</th>
                </tr>
              </thead>
              <tbody id="accountsBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" hidden>没有符合条件的账号</div>
          </div>
        </section>

        <section class="lower-grid">
          <div class="card section-body">
            <div class="section-head compact"><h2>最近事件</h2></div>
            <div id="eventsList" class="events-list"></div>
          </div>
          <aside class="card section-body">
            <div class="section-head compact"><h2>通知渠道</h2></div>
            <div id="notificationList" class="channel-list"></div>
            <div class="section-head compact provider-heading"><h2>通知事件</h2></div>
            <div id="notificationEventList" class="channel-list notification-events"></div>
            <div class="section-head compact provider-heading"><h2>Provider 能力</h2></div>
            <div id="capabilityList" class="channel-list"></div>
          </aside>
        </section>
      </main>

      <div id="accountDrawer" class="drawer" hidden>
        <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="关闭"></button>
        <aside class="drawer-panel" aria-labelledby="drawerTitle">
          <div class="drawer-header">
            <div><span id="drawerProvider" class="provider-tag"></span><h2 id="drawerTitle"></h2></div>
            <button id="drawerClose" class="btn btn-icon" type="button" title="关闭" aria-label="关闭">×</button>
          </div>
          <div id="drawerContent" class="drawer-content"></div>
        </aside>
      </div>

      <div id="credentialDrawer" class="drawer" hidden>
        <button id="credentialBackdrop" class="drawer-backdrop" type="button" aria-label="关闭"></button>
        <aside class="drawer-panel credential-panel" aria-labelledby="credentialTitle">
          <div class="drawer-header">
            <div><span class="provider-tag">CPA</span><h2 id="credentialTitle">添加账号</h2></div>
            <button id="credentialClose" class="btn btn-icon" type="button" title="关闭" aria-label="关闭">×</button>
          </div>
          <div class="drawer-content">
            <div class="segmented" role="tablist" aria-label="添加方式">
              <button id="oauthTabButton" class="segmented-button active" type="button" role="tab" aria-selected="true">Codex OAuth</button>
              <button id="uploadTabButton" class="segmented-button" type="button" role="tab" aria-selected="false">上传 JSON</button>
            </div>

            <section id="oauthPanel" class="import-panel">
              <div class="segmented oauth-provider-switch" role="tablist" aria-label="OAuth Provider">
                <button id="codexOAuthProviderButton" class="segmented-button active" type="button" role="tab" aria-selected="true">Codex OAuth</button>
                <button id="antigravityOAuthProviderButton" class="segmented-button" type="button" role="tab" aria-selected="false">Antigravity OAuth</button>
              </div>
              <div class="import-step">
                <div class="import-step-head"><span>授权链接</span><button id="startOAuthButton" class="btn btn-primary" type="button">生成链接</button></div>
                <div id="oauthLinkRow" class="oauth-link-row" hidden>
                  <a id="oauthLink" class="oauth-link" href="#" target="_blank" rel="noopener noreferrer">打开授权页</a>
                  <button id="copyOAuthLinkButton" class="btn btn-ghost" type="button">复制链接</button>
                </div>
              </div>
              <form id="oauthCallbackForm" class="import-step">
                <label for="oauthCallbackUrl">回调 URL</label>
                <textarea id="oauthCallbackUrl" class="input textarea" maxlength="4096" placeholder="http://localhost:1455/auth/callback?code=...&amp;state=..." required></textarea>
                <button id="submitOAuthCallbackButton" class="btn btn-primary" type="submit" disabled>提交回调</button>
              </form>
              <p id="oauthStatus" class="import-status" role="status">尚未开始</p>
            </section>

            <section id="uploadPanel" class="import-panel" hidden>
              <form id="uploadForm">
                <input id="authFileInput" type="file" accept=".json,application/json" multiple hidden>
                <div class="upload-picker">
                  <button id="chooseAuthFilesButton" class="btn" type="button">选择 JSON 文件</button>
                  <span id="uploadSelectionText">未选择文件</span>
                </div>
                <div id="uploadFileList" class="upload-file-list"></div>
                <button id="uploadAuthFilesButton" class="btn btn-primary btn-block" type="submit" disabled>上传到 CPA</button>
              </form>
              <p id="uploadStatus" class="import-status" role="status"></p>
            </section>
          </div>
        </aside>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script src="/app.js?v=0.5.0" defer></script>
  </body>
</html>
