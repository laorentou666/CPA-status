<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>CPA Status</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="loginView" class="login-shell" hidden>
      <form id="loginForm" class="login-panel">
        <div class="brand-mark">CS</div>
        <h1>CPA Status</h1>
        <label for="password">管理密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="button primary">登录</button>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">CS</div>
          <div>
            <strong>CPA Status</strong>
            <span>CLIProxyAPI 账号监测</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="connectionBadge" class="status-badge unknown">等待同步</span>
          <span id="lastSync" class="last-sync">尚未同步</span>
          <button id="refreshButton" class="button primary" type="button"><span aria-hidden="true">↻</span> 立即同步</button>
          <button id="logoutButton" class="icon-button" type="button" title="退出登录" hidden>退出</button>
        </div>
      </header>

      <nav class="view-tabs" aria-label="主视图">
        <button class="view-tab active" type="button" data-view="overview">监控概览</button>
        <button class="view-tab" type="button" data-view="accounts">账号管理</button>
      </nav>

      <main>
        <div id="overviewView">
        <section class="summary-band" aria-label="账号摘要">
          <div class="summary-inner">
            <article class="metric"><span>账号总数</span><strong id="totalCount">0</strong></article>
            <article class="metric good"><span>正常</span><strong id="healthyCount">0</strong></article>
            <article class="metric warn"><span>警告</span><strong id="warningCount">0</strong></article>
            <article class="metric danger"><span>额度耗尽</span><strong id="exhaustedCount">0</strong></article>
            <article class="metric muted"><span>不可用</span><strong id="unavailableCount">0</strong></article>
          </div>
        </section>

        <section class="workspace">
          <div class="section-heading">
            <div>
              <h2>账号状态</h2>
              <p id="scheduleText"></p>
            </div>
            <div class="filters">
              <input id="searchInput" type="search" placeholder="搜索账号、备注或索引" aria-label="搜索账号">
              <select id="providerFilter" aria-label="Provider 筛选"><option value="">全部 Provider</option></select>
              <select id="stateFilter" aria-label="状态筛选">
                <option value="">全部状态</option>
                <option value="healthy">正常</option>
                <option value="warning">警告</option>
                <option value="quota_exhausted">额度耗尽</option>
                <option value="auth_invalid">认证失效</option>
                <option value="disabled">已禁用</option>
                <option value="unavailable">不可用</option>
                <option value="unknown">未知</option>
              </select>
            </div>
          </div>

          <div class="table-frame">
            <table>
              <thead>
                <tr>
                  <th>账号</th>
                  <th>Provider</th>
                  <th>状态</th>
                  <th>计划</th>
                  <th>额度</th>
                  <th>请求</th>
                  <th>最后检查</th>
                </tr>
              </thead>
              <tbody id="accountsBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" hidden>没有符合条件的账号</div>
          </div>
        </section>

        <section class="lower-grid">
          <div class="events-panel">
            <div class="section-heading compact"><h2>最近事件</h2></div>
            <div id="eventsList" class="events-list"></div>
          </div>
          <aside class="operations-panel">
            <div class="section-heading compact"><h2>通知渠道</h2></div>
            <div id="notificationList" class="notification-list"></div>
            <div class="section-heading compact provider-heading"><h2>Provider 能力</h2></div>
            <div id="capabilityList" class="capability-list"></div>
          </aside>
        </section>
        </div>

        <section id="accountManagerView" class="workspace account-manager" hidden>
          <div class="section-heading account-manager-heading">
            <div>
              <h2>账号管理</h2>
              <p id="selectionText">已选择 0 个账号</p>
            </div>
            <div class="management-actions">
              <button id="deleteSelectedButton" class="button danger" type="button" disabled>删除所选</button>
              <button id="deleteAbnormalButton" class="button danger-outline" type="button">删除异常账号</button>
            </div>
          </div>
          <div class="filters management-filters">
            <input id="managerSearchInput" type="search" placeholder="搜索账号、备注或索引" aria-label="搜索待管理账号">
            <select id="managerProviderFilter" aria-label="账号管理 Provider 筛选"><option value="">全部 Provider</option></select>
            <select id="managerStateFilter" aria-label="账号管理状态筛选">
              <option value="">全部状态</option>
              <option value="healthy">正常</option>
              <option value="warning">警告</option>
              <option value="quota_exhausted">额度耗尽</option>
              <option value="auth_invalid">认证失效</option>
              <option value="disabled">已禁用</option>
              <option value="unavailable">不可用</option>
              <option value="unknown">未知</option>
            </select>
          </div>
          <div class="table-frame management-table-frame">
            <table class="management-table">
              <thead>
                <tr>
                  <th class="checkbox-column"><input id="selectAllAccounts" type="checkbox" aria-label="选择全部可删除账号"></th>
                  <th>账号</th>
                  <th>Provider</th>
                  <th>状态</th>
                  <th>来源</th>
                  <th>认证文件</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="managementBody"></tbody>
            </table>
            <div id="managementEmptyState" class="empty-state" hidden>没有符合条件的账号</div>
          </div>
        </section>
      </main>

      <div id="accountDrawer" class="drawer" hidden>
        <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="关闭"></button>
        <aside class="drawer-panel" aria-labelledby="drawerTitle">
          <div class="drawer-header">
            <div><span id="drawerProvider" class="provider-tag"></span><h2 id="drawerTitle"></h2></div>
            <button id="drawerClose" class="icon-button" type="button" title="关闭">×</button>
          </div>
          <div id="drawerContent" class="drawer-content"></div>
        </aside>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
